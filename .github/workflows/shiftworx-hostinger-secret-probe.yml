name: shiftworx-hostinger-secret-probe

on:
  push:
    branches: [main]
    paths:
      - '.ci/shiftworx-hostinger-secret-probe-trigger.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.HOSTINGER_HOST }}
      PORT: ${{ secrets.HOSTINGER_PORT }}
      USERNAME: ${{ secrets.HOSTINGER_USER }}
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Report capability booleans only
        shell: bash
        run: |
          set -Eeuo pipefail
          present(){ if [ -n "$1" ]; then echo 1; else echo 0; fi; }
          echo "HOST_PRESENT=$(present "$HOST")"
          echo "PORT_PRESENT=$(present "$PORT")"
          echo "USERNAME_PRESENT=$(present "$USERNAME")"
          echo "PRIVATE_KEY_PRESENT=$(present "$PRIVATE_KEY")"
          echo "KNOWN_HOSTS_PRESENT=$(present "$KNOWN_HOSTS")"
          if [ -n "$HOST" ] && [ -n "$PORT" ] && [ -n "$USERNAME" ] && [ -n "$PRIVATE_KEY" ] && [ -n "$KNOWN_HOSTS" ]; then
            echo HOSTINGER_CONTROLLER_READY=1
          else
            echo HOSTINGER_CONTROLLER_READY=0
          fi
