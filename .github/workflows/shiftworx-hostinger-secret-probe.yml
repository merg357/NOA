name: shiftworx-hostinger-secret-probe

on:
  push:
    branches: [main]
    paths:
      - '.ci/shiftworx-hostinger-secret-probe-trigger.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.HOSTINGER_HOST }}
      PORT: ${{ secrets.HOSTINGER_PORT }}
      USERNAME: ${{ secrets.HOSTINGER_USER }}
      PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
      HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
      HOSTINGER_API_KEY_2: ${{ secrets.HOSTINGER_API_KEY_2 }}
      PROJECTBRIDGE_ADMIN_TOKEN: ${{ secrets.PROJECTBRIDGE_ADMIN_TOKEN }}
      PROJECT_BRIDGE_ADMIN_TOKEN: ${{ secrets.PROJECT_BRIDGE_ADMIN_TOKEN }}
      BOTBRIDGE_TOKEN: ${{ secrets.BOTBRIDGE_TOKEN }}
    steps:
      - name: Report capability booleans only
        shell: bash
        run: |
          set -Eeuo pipefail
          present(){ if [ -n "$1" ]; then echo 1; else echo 0; fi; }
          echo "HOST_PRESENT=$(present "$HOST")"
          echo "PORT_PRESENT=$(present "$PORT")"
          echo "USERNAME_PRESENT=$(present "$USERNAME")"
          echo "PRIVATE_KEY_PRESENT=$(present "$PRIVATE_KEY")"
          echo "KNOWN_HOSTS_PRESENT=$(present "$KNOWN_HOSTS")"
          echo "HOSTINGER_API_KEY_PRESENT=$(present "$HOSTINGER_API_KEY")"
          echo "HOSTINGER_API_KEY_2_PRESENT=$(present "$HOSTINGER_API_KEY_2")"
          echo "PROJECTBRIDGE_ADMIN_TOKEN_PRESENT=$(present "$PROJECTBRIDGE_ADMIN_TOKEN")"
          echo "PROJECT_BRIDGE_ADMIN_TOKEN_PRESENT=$(present "$PROJECT_BRIDGE_ADMIN_TOKEN")"
          echo "BOTBRIDGE_TOKEN_PRESENT=$(present "$BOTBRIDGE_TOKEN")"
