name: homepc-maintenance-reachability

on:
  push:
    branches: [main]
    paths:
      - '.ci/homepc-maintenance-reachability-trigger.md'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe existing maintenance surfaces without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, urllib.request, urllib.error
          tests=[
            ('HOMEPC_STATUS','http://144.172.108.144:18813/status'),
            ('HOMEPC_UPDATE_SOURCE','http://5.161.236.43:8765/windows_status_server.py'),
          ]
          for name,url in tests:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ShiftWorx-recovery-reachability/1.0'})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      body=r.read(2_000_000)
                      print(f'{name}_STATUS={r.status}')
                      print(f'{name}_BYTES={len(body)}')
                      print(f'{name}_SHA256={hashlib.sha256(body).hexdigest()}')
              except urllib.error.HTTPError as e:
                  body=e.read(1000)
                  print(f'{name}_STATUS={e.code}')
                  print(f'{name}_BYTES={len(body)}')
              except Exception as e:
                  print(f'{name}_ERROR={type(e).__name__}:{str(e)[:160]}')
          PY
